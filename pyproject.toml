[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talk"
version = "1.1.0"
description = "TALK - Natural language to safe bash command assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TALK contributors" }]
license = { text = "MIT" }
keywords = ["cli", "assistant", "bash", "security", "ai", "terminal"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11",
  "Intended Audience :: End Users",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]

[project.scripts]
talk = "talk:main"
talk-gui = "talk_gui:main"

[tool.setuptools]
py-modules = ["talk", "talk_gui"]

[tool.setuptools.packages.find]
include = ["talk_core*"]
